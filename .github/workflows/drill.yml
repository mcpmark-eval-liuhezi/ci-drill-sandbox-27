name: CI Drill

# Stand-in for a stuck overnight CI build: this workflow sleeps long enough
# to embarrassment so we can rehearse detecting, cancelling, and verifying
# a wedged run from an automation surface.

on:
  push:
  workflow_dispatch:

jobs:
  wedged-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Simulate a stuck overnight CI build (sleep >= 10 minutes)
        run: |
          echo " drones CI build wedge for rehearsal purposes..."
          sleep 600
          echo "Drill sleep complete (600s)."
